name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 静态检查（py_compile + ruff 关键规则）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 这是 ComfyUI 自定义节点：torch / ComfyUI 运行时由宿主提供，
      # CI 不装 torch（约 800 MB），因此无法 import 节点做单测，
      # 用静态检查守住「语法可编译 + 无真 bug 级问题」两层。
      - name: py_compile（语法编译）
        run: python -m py_compile __init__.py batch_prompt_loader.py

      # 规则集在 bug 级（E9 / F63 / F7 / F82 随 E/F 全量包含）之上，
      # 扩至 TRY002（自定义异常替代裸 Exception）、S112（静默 continue
      # 必须留痕）、RUF010（f-string 转换旗标）、I001（import 排序）。
      # E501（行宽）与 BLE001（节点刻意兜底的盲 except，9 处）不纳入。
      - name: ruff check（语法错误、真 bug 级与可静态清理规则）
        run: |
          pip install --quiet --disable-pip-version-check ruff
          ruff check --select E,F,W,TRY002,S112,RUF010,I001 --ignore E501 .
