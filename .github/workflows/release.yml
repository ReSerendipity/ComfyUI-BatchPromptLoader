name: Release

# 治理规范 §10.2 口径（2026-10-18 收敛）：
#   tag 驱动 → 远端构建源码归档 + SHA256SUMS → 建 **draft** Release 并挂资产 → 人工审核后 published。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH (received: $TAG)" >&2
            exit 1
          fi

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4

      - name: Build source archive and SHA256SUMS
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ARCHIVE="ComfyUI-BatchPromptLoader-${TAG}.tar.gz"
          git archive --format=tar.gz --prefix="ComfyUI-BatchPromptLoader-${TAG}/" -o "${ARCHIVE}" HEAD
          sha256sum "${ARCHIVE}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create draft release with assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --verify-tag --generate-notes --draft --title "$TAG"
          gh release upload "$TAG" "ComfyUI-BatchPromptLoader-${TAG}.tar.gz" SHA256SUMS.txt
          echo "::notice::draft release $TAG created with assets — publish it after manual review."